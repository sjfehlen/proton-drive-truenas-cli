[project]
name = "proton-drive-truenas-cli"
version = "0.1.0"
description = "Scheduled one-way backups to Proton Drive using the official proton-drive CLI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "croniter>=2.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
