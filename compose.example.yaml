# Example for Arcane on bender. Adjust host paths and the port (check the port registry).
# No password is configured here: open the page the first time and create it (the setup code is in
# the container log). Setting UI_PASSWORD instead is optional; in an Arcane .env a literal `$` must be
# written `$$`.
services:
  proton-backup:
    image: ghcr.io/sjfehlen/proton-drive-truenas-cli:main
    container_name: proton-backup
    restart: unless-stopped
    # Starts as root only to fix the ownership of /data, then runs as PUID:PGID (default 568).
    ports:
      - "30465:8080"
    environment:
      TZ: America/Chicago
      # PUID/PGID: the user the app runs as; must be able to read the backup sources. Default 568.
      UI_USER: ${UI_USER:-admin}
      # UI_PASSWORD: optional; leave unset to create the password in the browser on first run
      UPLOAD_WORKERS: "2"        # starting value; the page's setting overrides it once saved
      BATCH_FILES: "50"
      BATCH_MB: "2000"
      STALL_SECONDS: "600"
      # The app downloads the Proton CLI into /data/bin on first start (SHA-512 checked).
      # PROTON_CLI_VERSION: "0.6.0"   # default; the version this app was tested with. "latest" follows Proton.
      # PROTON_CLI_AUTO_DOWNLOAD: "0" # turn off; then mount a binary and set PROTON_CLI_BIN
      STALE_DAYS: "3"
      # STALE_PING_URL: optional Uptime Kuma push URL, pinged "down" if no job succeeds in STALE_DAYS
    volumes:
      # State DB, the Proton session file (a credential) and the downloaded CLI. The folder is created and
      # owned by the container on first start if it does not exist.
      - /mnt/Storage/Application/Arcane/proton-backup/data:/data
      # Backup sources, read-only. Add one line per job source.
      - /mnt/Storage/Application/Immich:/sources/immich:ro
      - /mnt/Storage/GeneralFiles:/sources/generalfiles:ro
